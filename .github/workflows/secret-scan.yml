# Secret scanning with gitleaks.
#
# - On pull_request: scans only the commits introduced by the PR (the diff),
#   so pre-existing history is not re-flagged on every PR.
# - On schedule (weekly) and manual dispatch: scans the FULL history of the
#   default branch, catching anything that slipped through earlier.
#
# The scanner config lives in .gitleaks.toml and intentionally allowlists only
# documented synthetic / placeholder fixtures (see that file). Real credentials
# MUST NOT be added to the allowlist.
#
# Action versions are pinned to full commit SHAs.

name: Secret scan

on:
  pull_request:
  push:
    branches: ["prog/main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history is required so the scheduled (full-history) run can
          # scan every commit. On pull_request the gitleaks-action restricts the
          # scan to the PR's commits automatically.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          # On pull_request the action scans only new commits; on schedule it
          # scans all history by default.
          GITLEAKS_ARGS: "detect --source=. --redact --verbose"
