name: CI

# This workflow exists because until now nothing ran on a commit. Every claim in
# AGENTS.md about "N checks, 0 failures" was a recollection from a manual run.
# These jobs turn those claims into facts that fail a build.
#
# What is deliberately NOT here yet: a deploy job, a release artifact, and a
# hosted database. There is no authenticated transport to deploy, so a deploy
# stage would be decoration. It attaches when the bundle transport slice lands.
#
# BRANCH POLICY (ME-14): the default and integration branch is `prog/main`;
# there is no `main` or `master`. `push` is limited to `prog/**`, and
# `pull_request` covers every target branch, so a phase branch is verified by
# its PR. Any tool or workflow that needs a base branch must name `prog/main`.
#
# A commit message saying "[gate: … pass]" is the author's claim, not a result.
# Only this workflow's output (or a recorded run) is evidence.

on:
  # `main` is the public branch. `prog/**` is the integration branch and its
  # phase branches, which until now were never verified by CI at all: the push
  # trigger named `main` only, and `prog/main` is 111 commits ahead of it, so the
  # green badge on the README described a tree nobody was working on.
  #
  # What this does NOT do: `pull_request` still covers every target branch, and
  # nothing here runs the hosted suites (`pnpm run verify:hosted`) or any browser
  # harness (`verify:signin`, `verify:deployed`, the XSS client-path harness).
  # Those need credentials and a Chrome install, and they stay stopped.
  push:
    branches: ['prog/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.20.0'

jobs:
  workspace:
    name: Lint, typecheck, build, JS harnesses
    runs-on: ubuntu-24.04
    env:
      # The XSS suite in `pnpm run verify` drives the installed Chrome over the DevTools
      # Protocol. tooling/security/xss-harness.mjs defaults to the Windows install path,
      # so without this the gate fails on a Linux runner with "Chrome not found".
      # GitHub's ubuntu-24.04 image ships Chrome at this path.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Excludes the Tauri shell, which needs a Rust toolchain and Linux system
      # libraries; it has its own job below.
      - name: Build
        run: pnpm run build:node

      # The two model-dependent harnesses fetch the pinned MiniLM weights from
      # Hugging Face on first run. The revision is pinned to a commit sha in
      # packages/embedder/src/model.ts, so the cache key is stable; a changed
      # pin produces a different key and a fresh download rather than a stale
      # model silently scoring the gate.
      - name: Restore pinned model cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: embedder-${{ runner.os }}-minilm-q8-751bff37

      - name: Verification gate
        run: pnpm run verify

      # Proves the build output is a real, servable bundle rather than a
      # side effect of typechecking. Uploaded but not deployed anywhere.
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  database:
    name: Migrations, RBAC, telemetry, RLS bypass
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # GitHub-hosted runners already have Docker, which is all verify-phase7.sh
      # needs. It creates its own throwaway PostgreSQL 17 container, drops and
      # recreates the database, applies every migration, then runs SEVEN steps
      # (tooling/db/verify-phase7.sh:9-15): an offline SQL lint, then rbac_matrix
      # (99 probes), phase5_telemetry (17), rls_bypass (40), rls_bypass_fleet
      # (>1,000, an ACCEPTED RED - see the F-1 record), phase8_retention (16) and
      # rls_surface_audit (no callable function builds SQL).
      - name: Database verification
        run: bash tooling/db/verify-phase7.sh

  desktop:
    name: Desktop shell links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tauri's frontendDist points at apps/web/dist and there is no
      # beforeBuildCommand, so the web bundle has to exist before cargo runs.
      - name: Build web bundle
        run: pnpm run build:node

      # Tauri's documented Linux prerequisites. wry links against webkit2gtk, so
      # without these the build fails on a missing pkg-config rather than on
      # anything in this repository.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            file

      # cargo build rather than `tauri build --no-bundle`: this gate is about
      # the shell compiling and linking, and it does not need a bundle step that
      # is still unproven.
      - name: Cargo build
        working-directory: apps/desktop/src-tauri
        run: cargo build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No `pnpm install`: pnpm audit reads the lockfile, and skipping the
      # install keeps this gate fast and independent of the workspace build.
      #
      # Fails on new or escalated advisories against tooling/audit-baseline.json.
      # The accepted set is EMPTY as of 2026-10-07: @sop/mobile was excluded from
      # the workspace install, which removed node-forge, braces and sprintf-js
      # with it, and sharp was forced to 0.35.5. The gate is therefore strict -
      # any advisory appearing in `pnpm audit --prod` fails the build.
      - name: Dependency gate
        run: pnpm run audit
