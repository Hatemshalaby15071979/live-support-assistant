packages:
  - "apps/*"
  - "packages/*"

# `apps/mobile` was withdrawn from the workspace on 2026-10-07 (decision G9,
# docs/prereg/g9-drop-mobile.md): every advisory left in the repository arrived
# through its Expo SDK 51 toolchain, none had a published fix, and nothing that
# shipped imported it. The trade was real and was recorded as such — out of the
# dependency graph, `pnpm install` never installs the app's dependencies, so a
# clean clone cannot build it at all.
#
# Re-included on 2026-11-15 with the Expo SDK 58 / React Native 0.88 upgrade.
# Every one of those toolchain advisories now has a published patch, and the
# three that needed a floor are pinned in `overrides` below with their parent
# ranges, so the audit stays at 0 advisories with the app in the graph. The app
# bundles again on web, android and ios — that is the condition G9 named for
# revisiting it, met rather than assumed.

# pnpm's default isolated layout keeps every package inside `.pnpm/` and gives
# each one only the dependencies it declares. Metro — the bundler behind Expo
# and React Native — walks `node_modules` directories instead of a dependency
# graph, so it cannot follow that layout for a native bundle:
#
#   Unable to resolve "@react-native/virtualized-lists" from
#   node_modules/.pnpm/react-native@0.88.1.../FlatList.js
#
# `expo export --platform web` passed while `--platform android` could not
# build, because the web path never imports FlatList. Hoisting is the layout
# React Native's tooling is written against.
nodeLinker: hoisted

# source-map-js 1.2.1 is vulnerable to an event-loop denial of service through
# indexed source-map section offsets (GHSA-68fv-2mgg-jv7q, high, fixed in 1.2.2).
# It arrives transitively in three places in the lockfile, so a direct dependency
# bump is not possible; this override forces the whole tree to the patched
# version.
#
# This lives here rather than in package.json because pnpm 11 no longer reads
# `pnpm.overrides` from package.json -- it warns and ignores the key, which would
# have made the override look applied while changing nothing.
overrides:
  source-map-js: 1.2.2

  # Advisory-driven dependency floor, 2026-10-06.
  #
  # Every entry below was chosen from pnpm's own advisory output, not from the
  # advisory prose: three of the 39 findings (braces, node-forge, sprintf-js)
  # name a patched release that does not exist on npm, so they cannot be fixed
  # by an override and stay in the baseline with their reasons recorded.
  #
  # Two shapes of fix are in here, and the difference matters:
  #
  #   * Deduplication (@xmldom/xmldom, postcss, send). These already carry a
  #     patched copy in the lockfile -- 0.9.12, 8.5.28, 0.19.2 -- alongside a
  #     stale vulnerable one (0.7.13, 8.4.49, 0.18.0). Forcing every copy to
  #     the version already present clears the finding without introducing an
  #     upgrade. Note that advisory floors name *lower* versions here
  #     (postcss >=8.5.23, send >=0.19.0); overriding to the advisory's number
  #     would have been a downgrade, so each entry is the installed version.
  #
  #   * Genuine major bumps (fast-xml-parser, image-size, tar, uuid). These
  #     cross a major boundary and are the risk in this change. Each was
  #     verified against the build, the eight verify suites and the dependency
  #     gate before being kept.
  '@xmldom/xmldom': 0.9.12
  fast-xml-parser: 5.7.0
  image-size: 2.0.3
  postcss: 8.5.28
  send: 0.19.2
  tar: 7.5.21
  uuid: 11.1.1

  # Advisory-driven dependency floor, 2026-10-07.
  #
  # sharp 0.35.4 -> 0.35.5. GHSA-wq5f-xc86-pv6w (high, CWE-416) was published to
  # the GitHub Advisory Database on 2026-10-06, after the dependency pass above,
  # which is why it was not in that pass's baseline: the lockfile did not change,
  # the advisory database did. It is a use-after-free in sharp's bundled librsvg,
  # reachable by decoding SVG on glibc Linux under a non-PIE node.
  #
  # This product embeds text and never calls sharp — it arrives transitively as a
  # dependency of @huggingface/transformers, which uses it for image processing.
  # Unlike the three entries in the baseline, this one HAS a published patch, and
  # that patch is inside the range transformers already declares (^0.35.4), so
  # this is a patch bump rather than a tolerance. Verified against the registry
  # before writing it: sharp@0.35.5 resolves.
  sharp: 0.35.5

  # Advisory-driven dependency floor, 2026-11-14.
  #
  # Two Dependabot alerts, both with a published patch:
  #
  #   * zod 4.6.5 -> 4.6.6. GHSA-mrhx-c7xc-m3w5 (high): memory exhaustion while
  #     validating oversized constrained collections. This is a patch inside the
  #     ^4 range every importer already declares, so it is a straight bump.
  #
  #   * minimatch 10.2.6 -> 11.0.1. GHSA-g3hv-75wg-m249 (medium): denial of
  #     service via globparts amplification. Arrives transitively in three
  #     importers (lockfile), so no direct bump is possible. minimatch 11 requires
  #     Node >=20; this workspace requires >=22, so the engine floor is met. The
  #     tooling callers were exercised by the audit gate and the verification
  #     suite after the override.
  zod: 4.6.6
  minimatch: 11.0.1

  # Advisory-driven dependency floor, 2026-11-15, from the Expo SDK 58 upgrade.
  #
  # The upgrade moved the mobile toolchain (Expo CLI, React Native CLI) and with
  # it three packages that the SDK 51 tree did not carry at these versions. All
  # three have a published patch inside the range their parent already declares,
  # so none of them is a tolerance:
  #
  #   * node-forge 1.4.0 -> 1.4.3. Four advisories (one high) through
  #     @expo/cli -> @expo/code-signing-certificates, which declares ^1.3.0.
  #   * shell-quote 1.10.0 -> 1.11.0. GHSA-pqg4-j6r4-53mv (critical) through
  #     react-devtools-core, which declares ^1.6.1.
  #   * joi 17.13.8 -> 17.13.9. GHSA-4528-x5fx-h6hg (high) through
  #     @react-native-community/cli-config, which declares ^17.13.3.
  #
  # deepmerge stays unfixed on purpose: its advisory names 4.3.2 as patched and
  # 4.3.2 has never been published (`npm view deepmerge version` -> 4.3.1). It
  # is recorded in the baseline with that reason instead of being papered over.
  node-forge: 1.4.3
  shell-quote: 1.11.0
  joi: 17.13.9

# onnxruntime-node downloads its native binaries in a postinstall script;
# protobufjs is pulled in by the ONNX toolchain. Both must be allowed to build.
allowBuilds:
  onnxruntime-node: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4

